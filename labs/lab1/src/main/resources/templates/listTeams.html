<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Team Manager - Choose a Team</title>
    <style type="text/css">
        body {
            width: 800px;
            margin: auto;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>
<header>
    <h1>Welcome to the Team Manager</h1>
</header>
<main>
    <h2>Choose a team:</h2>
    <form action="/players" method="GET">
       <div th:each="t: ${teams}">
           <input type="radio" name="teamId" th:value="${t.id}" required>
           <span th:text="${t.name} + ', City: ' + ${t.city} + ', Players: ' + ${t.players.size()}"></span>
           <br>
       </div>
        <input type="submit" value="Submit">
    </form>
</main>
</body>
</html>
